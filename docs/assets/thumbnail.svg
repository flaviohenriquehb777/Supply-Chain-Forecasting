<svg width="1200" height="675" viewBox="0 0 1200 675" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Prévia da aplicação Supply Chain Forecasting">
  <defs>
    <!-- Fundo -->
    <linearGradient id="fundo" x1="0" y1="0" x2="1200" y2="675" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0d1524"/>
      <stop offset="1" stop-color="#0b0f17"/>
    </linearGradient>

    <!-- Brilho neon do contorno -->
    <linearGradient id="neon" x1="0" y1="0" x2="1200" y2="675" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="0.5" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>

    <!-- Glow azul -->
    <radialGradient id="glowAzul" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
                    gradientTransform="translate(220 60) rotate(28) scale(560 380)">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCiano" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
                    gradientTransform="translate(1080 40) rotate(160) scale(500 340)">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>

    <!-- Gradiente da linha ciano -->
    <linearGradient id="linhaCiano" x1="0" y1="0" x2="700" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>

    <!-- Sombra externa -->
    <filter id="sombraExterna" x="-8%" y="-12%" width="116%" height="128%">
      <feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#000000" flood-opacity="0.62"/>
    </filter>
    <filter id="sombraCard" x="-12%" y="-24%" width="124%" height="152%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <filter id="glowLinha" x="-12%" y="-40%" width="124%" height="180%">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#22d3ee" flood-opacity="0.55"/>
    </filter>

    <!-- Máscara de recorte da janela -->
    <clipPath id="recorteJanela">
      <rect x="40" y="40" width="1120" height="595" rx="20"/>
    </clipPath>

    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#121a28"/>
      <stop offset="1" stop-color="#0f1622"/>
    </linearGradient>
  </defs>

  <!-- Fundo com brilhos -->
  <rect width="1200" height="675" rx="0" fill="url(#fundo)"/>
  <rect width="1200" height="675" fill="url(#glowAzul)"/>
  <rect width="1200" height="675" fill="url(#glowCiano)"/>

  <!-- Janela da aplicação -->
  <g filter="url(#sombraExterna)">
    <rect x="40" y="40" width="1120" height="595" rx="20" fill="#0b0f17"/>
    <rect x="40" y="40" width="1120" height="595" rx="20" fill="none" stroke="url(#neon)" stroke-width="1.6" stroke-opacity="0.85"/>
  </g>

  <g clip-path="url(#recorteJanela)">
    <!-- Barra de título estilo navegador -->
    <rect x="40" y="40" width="1120" height="44" fill="#0f1622"/>
    <circle cx="70" cy="62" r="6" fill="#f87171"/>
    <circle cx="92" cy="62" r="6" fill="#f0b429"/>
    <circle cx="114" cy="62" r="6" fill="#34d399"/>
    <rect x="150" y="49" width="360" height="26" rx="13" fill="#0a1220" stroke="#223049" stroke-width="1"/>
    <text x="168" y="66" font-family="monospace" font-size="12" fill="#5e7392">forecasting.redebandeirante.app</text>

    <!-- Cabeçalho: logo + título -->
    <rect x="72" y="108" width="46" height="46" rx="12" fill="#101a2b" stroke="#223049" stroke-width="1"/>
    <circle cx="95" cy="131" r="11" fill="none" stroke="#22d3ee" stroke-width="2.4"/>
    <circle cx="95" cy="131" r="3.4" fill="#3b82f6"/>

    <text x="134" y="128" font-family="Inter, Segoe UI, sans-serif" font-size="21" font-weight="700" fill="#e8eef8"
          letter-spacing="-0.4">Supply Chain Forecasting</text>
    <text x="134" y="149" font-family="Inter, Segoe UI, sans-serif" font-size="12.5" fill="#8ea1bd">
      Rede Bandeirante · 144 lojas · 1 centro de distribuição
    </text>

    <!-- Chips à direita -->
    <rect x="946" y="112" width="86" height="26" rx="13" fill="#0e2231" stroke="#1d5b6b" stroke-width="1"/>
    <text x="962" y="129" font-family="monospace" font-size="11.5" fill="#22d3ee">H = 28 d</text>
    <rect x="1042" y="112" width="86" height="26" rx="13" fill="#0e2231" stroke="#1d5b6b" stroke-width="1"/>
    <text x="1058" y="129" font-family="monospace" font-size="11.5" fill="#22d3ee">Corte 03/10</text>

    <!-- Divisória -->
    <line x1="72" y1="176" x2="1128" y2="176" stroke="#1a2437" stroke-width="1.4"/>

    <!-- Barra de controles -->
    <rect x="72" y="196" width="1056" height="66" rx="14" fill="url(#cardGrad)" stroke="#223049" stroke-width="1"/>
    <text x="94" y="220" font-family="Inter, sans-serif" font-size="9.5" font-weight="600" fill="#5e7392" letter-spacing="0.8">PRODUTO (SKU)</text>
    <rect x="94" y="228" width="176" height="24" rx="7" fill="#0a1220" stroke="#223049" stroke-width="1"/>
    <text x="106" y="244" font-family="monospace" font-size="12" fill="#e8eef8">P0131</text>

    <text x="300" y="220" font-family="Inter, sans-serif" font-size="9.5" font-weight="600" fill="#5e7392" letter-spacing="0.8">NÍVEL DE SERVIÇO ALVO</text>
    <rect x="300" y="236" width="300" height="5" rx="2.5" fill="#16233a"/>
    <rect x="300" y="236" width="262" height="5" rx="2.5" fill="url(#linhaCiano)"/>
    <circle cx="562" cy="238.5" r="8.5" fill="#e8eef8" stroke="#3b82f6" stroke-width="3"/>
    <text x="618" y="243" font-family="monospace" font-size="13" font-weight="600" fill="#22d3ee">93,75%</text>

    <text x="726" y="220" font-family="Inter, sans-serif" font-size="9.5" font-weight="600" fill="#5e7392" letter-spacing="0.8">ESTOQUE NO CD (UN)</text>
    <rect x="726" y="228" width="150" height="24" rx="7" fill="#0a1220" stroke="#223049" stroke-width="1"/>
    <text x="738" y="244" font-family="monospace" font-size="12" fill="#e8eef8">3.000</text>

    <text x="902" y="220" font-family="Inter, sans-serif" font-size="9.5" font-weight="600" fill="#5e7392" letter-spacing="0.8">NÍVEL ÓTIMO</text>
    <text x="902" y="243" font-family="monospace" font-size="12" fill="#8ea1bd">Cu / (Cu + Co) = 93,75%</text>

    <!-- KPIs -->
    <g filter="url(#sombraCard)">
      <rect x="72" y="282" width="252" height="86" rx="13" fill="url(#cardGrad)" stroke="#223049" stroke-width="1"/>
      <rect x="72" y="282" width="3" height="86" rx="1.5" fill="url(#linhaCiano)"/>
      <text x="94" y="308" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#8ea1bd" letter-spacing="0.6">PREVISÃO 28 DIAS</text>
      <text x="94" y="342" font-family="monospace" font-size="26" font-weight="700" fill="#e8eef8">8.199 un</text>
      <text x="94" y="358" font-family="monospace" font-size="10" fill="#5e7392">292,8 un/dia</text>

      <rect x="340" y="282" width="252" height="86" rx="13" fill="url(#cardGrad)" stroke="#223049" stroke-width="1"/>
      <rect x="340" y="282" width="3" height="86" rx="1.5" fill="url(#linhaCiano)"/>
      <text x="362" y="308" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#8ea1bd" letter-spacing="0.6">REALIZADO 28 DIAS</text>
      <text x="362" y="342" font-family="monospace" font-size="26" font-weight="700" fill="#e8eef8">8.158 un</text>
      <text x="362" y="358" font-family="monospace" font-size="10" fill="#5e7392">291,4 un/dia</text>

      <rect x="608" y="282" width="252" height="86" rx="13" fill="url(#cardGrad)" stroke="#223049" stroke-width="1"/>
      <rect x="608" y="282" width="3" height="86" rx="1.5" fill="url(#linhaCiano)"/>
      <text x="630" y="308" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#8ea1bd" letter-spacing="0.6">WMAPE DO HOLDOUT</text>
      <text x="630" y="342" font-family="monospace" font-size="26" font-weight="700" fill="#e8eef8">8,41%</text>
      <text x="630" y="358" font-family="monospace" font-size="10" fill="#5e7392">Σ|prev − real| / Σreal</text>

      <rect x="876" y="282" width="252" height="86" rx="13" fill="url(#cardGrad)" stroke="#223049" stroke-width="1"/>
      <rect x="876" y="282" width="3" height="86" rx="1.5" fill="url(#linhaCiano)"/>
      <text x="898" y="308" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#8ea1bd" letter-spacing="0.6">VIÉS (MPE)</text>
      <text x="898" y="342" font-family="monospace" font-size="26" font-weight="700" fill="#f0b429">+0,50%</text>
      <text x="898" y="358" font-family="monospace" font-size="10" fill="#5e7392">Σ(prev − real) / Σreal</text>
    </g>

    <!-- Painel do gráfico -->
    <rect x="72" y="386" width="700" height="222" rx="14" fill="url(#cardGrad)" stroke="#223049" stroke-width="1"/>
    <text x="94" y="414" font-family="Inter, sans-serif" font-size="13" font-weight="650" fill="#e8eef8">Histórico, previsão e realizado</text>
    <!-- legenda -->
    <rect x="452" y="405" width="10" height="10" rx="3" fill="#64748b"/>
    <text x="468" y="414" font-family="Inter, sans-serif" font-size="10" fill="#8ea1bd">Histórico</text>
    <rect x="546" y="405" width="10" height="10" rx="3" fill="#f0b429"/>
    <text x="562" y="414" font-family="Inter, sans-serif" font-size="10" fill="#8ea1bd">Realizado</text>
    <rect x="644" y="405" width="10" height="10" rx="3" fill="#22d3ee"/>
    <text x="660" y="414" font-family="Inter, sans-serif" font-size="10" fill="#8ea1bd">Previsão</text>

    <!-- grade -->
    <g stroke="#26374f" stroke-width="0.8" stroke-dasharray="3 5" opacity="0.55">
      <line x1="94" y1="470" x2="750" y2="470"/>
      <line x1="94" y1="520" x2="750" y2="520"/>
      <line x1="94" y1="570" x2="750" y2="570"/>
    </g>
    <line x1="94" y1="592" x2="750" y2="592" stroke="#223049" stroke-width="1"/>

    <!-- Linha histórica -->
    <path d="M94 560 L128 548 L162 556 L196 536 L230 544 L264 522 L298 534 L332 512 L366 526 L400 500 L434 514 L468 492 L502 506 L536 486 L570 500 L604 494"
          fill="none" stroke="#64748b" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <!-- Linha realizado no holdout -->
    <path d="M604 494 L638 480 L672 490 L706 466 L740 476"
          fill="none" stroke="#f0b429" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
    <!-- Linha prevista no holdout -->
    <g filter="url(#glowLinha)">
      <path d="M604 500 L638 486 L672 496 L706 472 L740 484"
            fill="none" stroke="#22d3ee" stroke-width="3" stroke-dasharray="7 5" stroke-linejoin="round" stroke-linecap="round"/>
    </g>
    <!-- marcadores realizados -->
    <g fill="#f0b429">
      <circle cx="638" cy="480" r="3.2"/>
      <circle cx="672" cy="490" r="3.2"/>
      <circle cx="706" cy="466" r="3.2"/>
      <circle cx="740" cy="476" r="3.2"/>
    </g>
    <!-- rótulos eixo x -->
    <g font-family="monospace" font-size="9.5" fill="#5e7392">
      <text x="94" y="612">07/04</text>
      <text x="250" y="612">04/06</text>
      <text x="410" y="612">01/08</text>
      <text x="560" y="612">16/09</text>
      <text x="700" y="612">03/10</text>
    </g>

    <!-- Painel da conta aberta -->
    <rect x="788" y="386" width="340" height="222" rx="14" fill="url(#cardGrad)" stroke="#223049" stroke-width="1"/>
    <text x="810" y="414" font-family="Inter, sans-serif" font-size="13" font-weight="650" fill="#e8eef8">Conta aberta do pedido</text>

    <text x="810" y="446" font-family="Inter, sans-serif" font-size="11.5" fill="#8ea1bd">Demanda prevista (28 dias)</text>
    <text x="1108" y="446" font-family="monospace" font-size="12.5" fill="#e8eef8" text-anchor="end">8.199 un</text>
    <line x1="810" y1="458" x2="1106" y2="458" stroke="#1a2437" stroke-width="1" stroke-dasharray="3 4"/>

    <text x="810" y="482" font-family="Inter, sans-serif" font-size="11.5" fill="#8ea1bd">(+) Estoque de segurança</text>
    <text x="1108" y="482" font-family="monospace" font-size="12.5" fill="#e8eef8" text-anchor="end">784 un</text>
    <line x1="810" y1="494" x2="1106" y2="494" stroke="#1a2437" stroke-width="1" stroke-dasharray="3 4"/>

    <text x="810" y="518" font-family="Inter, sans-serif" font-size="11.5" fill="#8ea1bd">(−) Estoque no CD</text>
    <text x="1108" y="518" font-family="monospace" font-size="12.5" fill="#e8eef8" text-anchor="end">−3.000 un</text>
    <line x1="810" y1="532" x2="1106" y2="532" stroke="#223049" stroke-width="2"/>

    <text x="810" y="562" font-family="Inter, sans-serif" font-size="13" font-weight="650" fill="#e8eef8">(=) Pedido sugerido</text>
    <text x="1108" y="566" font-family="monospace" font-size="24" font-weight="700" fill="#22d3ee" text-anchor="end">5.982 un</text>

    <rect x="810" y="578" width="296" height="20" rx="6" fill="#0e2231" stroke="#1d5b6b" stroke-width="1"/>
    <text x="820" y="592" font-family="monospace" font-size="9.5" fill="#5fd8ea">Pedido = Previsão + SS − Estoque CD</text>
  </g>

  <!-- Selo CRISP-DM -->
  <rect x="40" y="647" width="1120" height="0" fill="none"/>
</svg>
